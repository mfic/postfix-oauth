name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh test/*.sh

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests (graph-send)
        run: ./test/graph-send.test.sh

      - name: Unit tests (failure-notice)
        run: bash ./test/failure-notice.test.sh

      - name: Unit tests (sender-rewrite)
        run: bash ./test/sender-rewrite.test.sh

      - name: Unit tests (tls-cert)
        run: bash ./test/tls-cert.test.sh

      - name: Config tests (in the relay image)
        run: bash ./test/config.test.sh

      - name: Smoke test (both outbound modes)
        run: ./test/smoke.sh
