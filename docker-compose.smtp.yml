# Outbound via SMTP submission with XOAUTH2 (SMTP.SendAsApp):
#   docker compose -f docker-compose.smtp.yml up -d --build
# Requires RELAY_MAILBOX in .env and the Exchange service-principal setup
# described in the README.
services:
  postfix:
    build: .
    container_name: postfix-m365-relay
    hostname: ${POSTFIX_HOSTNAME:-mailrelay.local}
    restart: unless-stopped
    env_file: .env
    environment:
      OUTBOUND_MODE: smtp
    ports:
      - "25:25"     # plain SMTP for IP-whitelisted printers
      - "587:587"   # submission (STARTTLS) for printers using username/password
    volumes:
      - ./config:/config:ro
      - postfix-spool:/var/spool/postfix
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      # sends nothing: Postfix answers 554 to a client that talks before the banner
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 25 </dev/null | grep -q ^220"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Off unless .env has COMPOSE_PROFILES=letsencrypt (README step 4). Holds the
  # Cloudflare token, so the relay doesn't.
  certbot:
    image: certbot/dns-cloudflare:v5.9.0
    container_name: postfix-m365-certbot
    profiles: [letsencrypt]
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/letsencrypt-renew.sh"]
    environment:
      POSTFIX_HOSTNAME: ${POSTFIX_HOSTNAME:-}
      LETSENCRYPT_SERVER: ${LETSENCRYPT_SERVER:-}
    volumes:
      - ./scripts/letsencrypt-renew.sh:/usr/local/bin/letsencrypt-renew.sh:ro
      - ./cloudflare.ini:/run/cloudflare.ini:ro
      - letsencrypt:/etc/letsencrypt

volumes:
  postfix-spool:
  letsencrypt:
