services:
  relay:
    build: ..
    container_name: postfix-oauth-test-relay
    hostname: mailrelay.test.local
    environment:
      TENANT_ID: 00000000-0000-0000-0000-000000000000
      CLIENT_ID: 00000000-0000-0000-0000-000000000000
      CLIENT_SECRET: dummy-secret-for-tests
      POSTFIX_HOSTNAME: mailrelay.test.local
      OUTBOUND_MODE: graph
      TOKEN_ENDPOINT: http://mockgraph:8080/token
      FAILURE_NOTICE_MAILBOX: ${FAILURE_NOTICE_MAILBOX:-}
      FAILURE_NOTICE_SENDER: ${FAILURE_NOTICE_SENDER:-}
      FAILURE_NOTICE_ATTACH_MESSAGE: ${FAILURE_NOTICE_ATTACH_MESSAGE:-}
      GRAPH_ENDPOINT: http://mockgraph:8080/v1.0
      TLS_WATCH_SECONDS: ${TLS_WATCH_SECONDS:-}
      TLS_MIN_VERSION: ${TLS_MIN_VERSION:-}
    volumes:
      - ${FIXTURES:-./fixtures}:/config:ro
    depends_on:
      - mockgraph

  mockgraph:
    image: python:3-alpine
    container_name: postfix-oauth-test-mockgraph
    volumes:
      - ./mock-graph.py:/mock-graph.py:ro
    command: ["sh", "-c", "mkdir -p /state && exec python3 /mock-graph.py 8080 /state"]
